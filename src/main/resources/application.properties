spring.application.name=JPA_MySQL_CRUD
# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/JPAMySQL_CRUD
spring.datasource.username=spring
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update


#for Advanced Configuration: @ConfigurationProperties, Profiles

# Common properties /@Profile test
app.name=My Spring Boot Application
spring.profiles.active=dev,prod

server.port=8081


# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://0.0.0.0:8080/realms/myrealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://0.0.0.0:8080/realms/myrealm/protocol/openid-connect/certs

# JWT Configuration
jwt.auth.converter.resource-id=myClient
jwt.auth.converter.principal-attribute=sub

# Logging Configuration
logging.level.org.springframework.security=DEBUG